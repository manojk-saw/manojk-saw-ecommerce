server:
  port: 8087

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service-route
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - CustomRouteFilter

            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/products/**, /api/categories/**
              filters:
                - CustomRouteFilter

            - id: INVENTORY-SERVICE
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory/**
              filters:
                - CustomRouteFilter

            - id: ORDER-SERVICE
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - CustomRouteFilter                           
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka